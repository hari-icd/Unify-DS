<!-- Component: LC_Sidebar Navigation_Icon Only (core)
     Registry: see REGISTRY.md
     Prop: active — one of: home | agents | knowledge | copilot | workflows | search | apps |
                              guardrails | integrations | settings | notifications | assistant
                              (omit or pass empty for no item active)
-->
<style>
.rail{width:64px;background:var(--color-bg-primary);border-right:1px solid var(--color-border-secondary);display:flex;flex-direction:column;align-items:center;padding:var(--spacing-lg) 0;gap:var(--spacing-md);flex-shrink:0}
.rail-logo{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--utility-brand-600);display:grid;place-items:center;color:var(--color-white);margin-bottom:var(--spacing-md)}
.rail-btn{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--color-text-tertiary);position:relative;transition:background 120ms ease,color 120ms ease;background:none;border:0;cursor:pointer}
.rail-btn:hover{background:var(--utility-gray-50);color:var(--color-text-secondary)}
.rail-btn[aria-current="page"]{background:var(--utility-brand-50);color:var(--utility-brand-600)}
.rail-spacer{flex:1}
.rail-badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 var(--spacing-xs);border-radius:999px;background:var(--utility-error-500);color:var(--color-white);font-size:10px;font-weight:var(--weight-semibold);display:grid;place-items:center;line-height:1;border:2px solid var(--color-bg-primary)}
.rail-avatar{width:32px;height:32px;border-radius:999px;background:var(--utility-brand-secondary-100);color:var(--utility-brand-secondary-900);font-size:var(--text-xs);font-weight:var(--weight-semibold);display:grid;place-items:center;margin-top:var(--spacing-md)}
.rail .lucide{stroke:currentColor;fill:none;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
</style>

<nav class="rail" data-component="LC_Sidebar Navigation_Icon Only/Floating=No, Device=Desktop Vertical, Style=Framed" data-figma-name="Nav/PrimaryRail" aria-label="Primary">

    <svg width="18" height="18" viewBox="0 0 24 24" class="lucide" data-icon="lucide:hexagon"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44a1.97 1.97 0 0 1-1.96 0l-7.9-4.44A1 1 0 0 1 3 16.5v-9a1 1 0 0 1 .53-.88l7.9-4.44a1.97 1.97 0 0 1 1.96 0l7.9 4.44c.32.17.53.5.53.88z"/></svg>
  </div>

  <button class="rail-btn"{{?active==home}} aria-current="page"{{:}}{{/?}} aria-label="Home" data-component="Base_LC_Nav Unit_Icon Only/Type=Framed-md, Current={{?active==home}}True{{:}}False{{/?}}, Soft Fill=Off, State={{?active==home}}Selected{{:}}Default{{/?}}" data-figma-name="Nav/PrimaryRailItem">
    <svg width="20" height="20" viewBox="0 0 24 24" class="lucide" data-icon="lucide:home"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
